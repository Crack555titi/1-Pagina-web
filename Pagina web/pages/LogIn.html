<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Iniciar Sesión | Aerus Club</title>
    <link rel="stylesheet" href="/Pagina web/CSS/estilos.css">
    <link rel="stylesheet" href="/Pagina web/CSS/login.css">
    <script src="/Pagina web/Js/Pagina_Anterior.js"></script>
    <script src="/Pagina web/Js/registro.js"></script>   

</head>

<body>

<div class="login-container">
     <button class="oneclick-button" onclick="volverPaginaAnterior()">Volver</button>
    <form id="loginForm" class="login-box">
       
        <h2>Iniciar Sesión</h2>

        <div class="input-group">

            <label>Correo electrónico</label>

            <input
                type="email"
                id="email"
                placeholder="correo@ejemplo.com"
                required
            >

            <small id="emailError"></small>

        </div>

        <div class="input-group">

            <label>Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="********"
                required
            >

            <small id="passwordError"></small>

        </div>

        <div class="extras">

            <label>

                <input type="checkbox" id="remember">

                Recordar sesión

            </label>

            <a href="#">¿Olvidaste tu contraseña?</a>

        </div>

        <button class="submit-login" type="submit">

            Ingresar

        </button>

    </form>

</div>



</body>
</html>
