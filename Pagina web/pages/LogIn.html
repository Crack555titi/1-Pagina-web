<!DOCTYPE html>
<html lang="es-AR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Iniciar Sesión | Aerus Club</title>
    <link rel="stylesheet" href="../CSS/estilos.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <script src="../Js/Pagina_Anterior.js"></script>
    <script src="../Js/registro.js"></script>   
    <script src="../js/auth.js"></script>
</head>

<body>

<div class="login-container">
     <button class="oneclick-button" onclick="volverPaginaAnterior()">Volver</button>
    <form id="loginForm" class="login-box" onsubmit="validarUsuario(event)">
       
        <h2>Iniciar Sesión</h2>

        <div class="input-group">

            <label>Correo electrónico</label>

            <input
                type="email"
                id="email"
                placeholder="correo@ejemplo.com"
                required
            >

            <small id="emailError"></small>

        </div>

        <div class="input-group">

            <label>Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="********"
                required
            >

            <small id="passwordError"></small>

        </div>

        <div class="extras">

            <label>

                <input type="checkbox" id="remember">

                Recordar sesión

            </label>

            <a href="#">¿Olvidaste tu contraseña?</a>

        </div>

        <button class="submit-login" type="submit">

            Ingresar

        </button>

        
        <p class="register-link">
            ¿No tienes una cuenta? 
            <a href="Registrarse.html">
                Regístrate aquí</a>
        </p>
    </form>
    
</div>
</body>
</html>
